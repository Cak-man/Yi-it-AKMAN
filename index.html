<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yiğit Çakman — Freelance Senior Game Developer</title>
    <meta name="description" content="Freelance Senior Game Developer specializing in multiplayer, networked gameplay, gameplay systems and game prototyping.">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Yiğit Çakman — Freelance Senior Game Developer">
    <meta property="og:description" content="Freelance Senior Game Developer specializing in multiplayer, networked gameplay, gameplay systems and game prototyping.">
    
    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --------------------------------------------------
           1. COLOR PALETTE & VARIABLES
           -------------------------------------------------- */
        :root {
            --bg-main: #060D17;
            --bg-card: #0A1422;
            --bg-nav: rgba(6, 13, 23, 0.85);
            --accent: #37A8FF;
            --accent-glow: rgba(55, 168, 255, 0.15);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: rgba(55, 168, 255, 0.12);
            --border-hover: rgba(55, 168, 255, 0.35);
            
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --max-width: 1200px;
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --------------------------------------------------
           2. BASE RESETS & TYPOGRAPHY
           -------------------------------------------------- */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-family: var(--font-family);
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
        }

        body {
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: var(--transition);
        }

        img, video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .section {
            padding: 6rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: block;
        }

        .section-title {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 600px;
            margin-bottom: 3rem;
        }

        /* Tags */
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tag {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.25rem 0.6rem;
            background: rgba(55, 168, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 1.75rem;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background-color: #52b5ff;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            background-color: rgba(55, 168, 255, 0.05);
        }

        .btn-link {
            padding: 0;
            background: none;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .btn-link:hover {
            gap: 0.6rem;
        }

        /* Placeholders */
        .img-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0A1422 0%, #0F1D30 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            border: 1px dashed var(--border-color);
            min-height: 200px;
        }

        /* --------------------------------------------------
           3. NAVBAR
           -------------------------------------------------- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: var(--bg-nav);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            height: 70px;
            display: flex;
            align-items: center;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .brand {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
            color: var(--text-main);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-link {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .nav-link:hover {
            color: var(--text-main);
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* --------------------------------------------------
           4. HERO SECTION
           -------------------------------------------------- */
        .hero {
            min-height: 90vh;
            padding-top: 120px;
            padding-bottom: 4rem;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.75rem;
            background: rgba(55, 168, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 1.5rem;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        .hero-title {
            font-size: 3.25rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
        }

        .hero-title .highlight {
            color: var(--accent);
        }

        .hero-subtitle {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 1rem;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
            max-width: 500px;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
        }

        .hero-visual {
            width: 100%;
            aspect-ratio: 16/10;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
            transition: var(--transition);
        }

        .hero-visual:hover {
            border-color: var(--border-hover);
            transform: scale(1.01);
        }

        /* --------------------------------------------------
           5. WORK / PROJECTS SECTION
           -------------------------------------------------- */
        .featured-project {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 2rem;
            transition: var(--transition);
        }

        .featured-project:hover {
            border-color: var(--border-hover);
        }

        .featured-media {
            width: 100%;
            aspect-ratio: 21/9;
            background: #0A1422;
        }

        .featured-content {
            padding: 2rem;
        }

        .project-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .project-desc {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            max-width: 800px;
        }

        .secondary-projects {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: var(--transition);
        }

        .project-card:hover {
            border-color: var(--border-hover);
        }

        .card-media {
            width: 100%;
            aspect-ratio: 16/9;
        }

        .card-content {
            padding: 1.5rem;
        }

        /* --------------------------------------------------
           6. EXPERTISE SECTION
           -------------------------------------------------- */
        .expertise-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .expertise-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.75rem;
            transition: var(--transition);
        }

        .expertise-card:hover {
            border-color: var(--border-hover);
        }

        .expertise-num {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.75rem;
            display: block;
        }

        .expertise-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .expertise-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* --------------------------------------------------
           7. ARTICLES & BOOKS
           -------------------------------------------------- */
        .three-col-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .content-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .content-card:hover {
            border-color: var(--border-hover);
        }

        .content-media {
            width: 100%;
            aspect-ratio: 16/10;
        }

        .content-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .content-meta {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .content-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .content-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        /* --------------------------------------------------
           8. CODE & ASSETS
           -------------------------------------------------- */
        .code-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .code-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            transition: var(--transition);
        }

        .code-card:hover {
            border-color: var(--border-hover);
        }

        .code-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .code-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }

        .code-more {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-more-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* --------------------------------------------------
           9. ABOUT & CONTACT
           -------------------------------------------------- */
        .about-content {
            max-width: 750px;
        }

        .about-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            line-height: 1.7;
        }

        .about-text strong {
            color: var(--text-main);
        }

        .contact-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 3.5rem 2rem;
            text-align: center;
        }

        .contact-title {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
        }

        .contact-desc {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 500px;
            margin: 0 auto 2rem auto;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        .contact-link {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .contact-link:hover {
            color: var(--accent);
        }

        /* --------------------------------------------------
           10. FOOTER
           -------------------------------------------------- */
        .footer {
            padding: 2.5rem 0;
            background-color: var(--bg-main);
        }

        .footer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        /* --------------------------------------------------
           11. RESPONSIVE MEDIA QUERIES
           -------------------------------------------------- */
        @media (max-width: 992px) {
            .hero-grid {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            .expertise-grid, .three-col-grid, .code-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background: var(--bg-main);
                border-bottom: 1px solid var(--border-color);
                flex-direction: column;
                padding: 1.5rem;
                gap: 1.25rem;
            }
            .nav-links.active {
                display: flex;
            }
            .hamburger {
                display: block;
            }
            .hero-title {
                font-size: 2.5rem;
            }
            .secondary-projects, .expertise-grid, .three-col-grid, .code-grid {
                grid-template-columns: 1fr;
            }
            .featured-media {
                aspect-ratio: 16/9;
            }
            .code-more {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .footer-container {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            .hero-buttons {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
