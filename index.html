<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yiğit Çakman | Freelance Senior Game Developer</title>

    <meta name="description"
          content="Yiğit Çakman — Freelance Senior Game Developer specialized in multiplayer and networked gameplay, gameplay systems, prototyping and technical game development.">

    <meta name="theme-color" content="#07101d">

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #07101d;
            color: #f5f8fc;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body.menu-open {
            overflow: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        ::selection {
            background: #37a8ff;
            color: #06101c;
        }


        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {
            --bg: #07101d;
            --bg-soft: #0a1624;
            --card: #0b1726;

            --line: rgba(255,255,255,0.075);
            --line-blue: rgba(55,168,255,0.35);

            --text: #f5f8fc;
            --muted: #9aa8b9;
            --muted-2: #718095;

            --blue: #37a8ff;
            --blue-soft: rgba(55,168,255,0.08);

            --container: 1240px;
        }


        /* =========================================================
           GLOBAL
        ========================================================= */

        .container {
            width: min(88%, var(--container));
            margin: 0 auto;
        }

        section {
            position: relative;
            padding: 125px 0;
        }

        .section-heading {
            max-width: 760px;
            margin-bottom: 55px;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 12px;

            color: var(--blue);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;

            margin-bottom: 18px;
        }

        .section-label::before {
            content: "";
            width: 28px;
            height: 1px;
            background: var(--blue);
        }

        .section-title {
            font-size: clamp(40px, 5vw, 68px);
            line-height: 0.98;
            letter-spacing: -3px;
            font-weight: 750;
        }

        .section-description {
            margin-top: 20px;
            max-width: 700px;

            color: var(--muted);
            font-size: 17px;
            line-height: 1.8;
        }


        /* =========================================================
           NAVBAR
        ========================================================= */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 78px;

            z-index: 1000;

            border-bottom: 1px solid transparent;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                backdrop-filter 0.3s ease;
        }

        .navbar.scrolled {
            background: rgba(7,16,29,0.82);
            backdrop-filter: blur(18px);
            border-bottom-color: var(--line);
        }

        .navbar-inner {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 17px;
            font-weight: 850;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--blue);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 27px;

            list-style: none;

            color: #aab6c6;
            font-size: 13px;
        }

        .nav-links a {
            position: relative;
            transition: color 0.25s ease;
        }

        .nav-links a::after {
            content: "";

            position: absolute;
            left: 0;
            bottom: -7px;

            width: 0;
            height: 1px;

            background: var(--blue);

            transition: width 0.25s ease;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-contact {
            color: #fff !important;
        }

        .mobile-menu-button {
            display: none;

            width: 42px;
            height: 42px;

            border: 1px solid var(--line);
            background: transparent;

            color: white;
            border-radius: 8px;

            cursor: pointer;
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            min-height: 100vh;
            padding-top: 160px;
            padding-bottom: 90px;

            display: flex;
            align-items: center;

            overflow: hidden;
        }

        .hero-grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(55,168,255,0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(55,168,255,0.035) 1px,
                    transparent 1px
                );

            background-size: 72px 72px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black 0%,
                    rgba(0,0,0,0.7) 45%,
                    transparent 100%
                );

            pointer-events: none;
        }

        .hero-glow {
            position: absolute;

            width: 650px;
            height: 650px;

            right: -280px;
            top: 80px;

            border-radius: 50%;

            background: rgba(55,168,255,0.055);

            filter: blur(80px);

            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;

            display: grid;
            grid-template-columns: 1fr 0.9fr;
            gap: 75px;

            align-items: center;
        }

        .availability {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 8px 13px;

            border: 1px solid rgba(55,168,255,0.2);
            border-radius: 50px;

            background: rgba(55,168,255,0.04);

            color: #b8c5d5;
            font-size: 12px;

            margin-bottom: 28px;
        }

        .availability-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--blue);

            box-shadow: 0 0 14px var(--blue);
        }

        .hero-title {
            max-width: 850px;

            font-size: clamp(55px, 7vw, 96px);
            line-height: 0.94;

            letter-spacing: -5px;

            font-weight: 800;
        }

        .hero-title span {
            color: var(--blue);
        }

        .hero-specialization {
            margin-top: 28px;

            color: #d5dfeb;

            font-size: clamp(18px, 2vw, 25px);
            font-weight: 550;
        }

        .hero-description {
            max-width: 700px;

            margin-top: 17px;

            color: var(--muted);

            font-size: 17px;
            line-height: 1.8;
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 13px;

            margin-top: 33px;

            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 48px;

            padding: 0 20px;

            border-radius: 7px;

            font-size: 13px;
            font-weight: 750;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease,
                color 0.25s ease;
        }

        .button-primary {
            color: #06101c;
            background: var(--blue);
        }

        .button-primary:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 35px rgba(55,168,255,0.2);
        }

        .button-secondary {
            border: 1px solid #26394d;
            color: #d8e1eb;
        }

        .button-secondary:hover {
            transform: translateY(-2px);

            color: var(--blue);

            border-color: var(--blue);
        }

        .hero-project {
            position: relative;

            min-height: 520px;

            border: 1px solid var(--line);

            border-radius: 18px;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(55,168,255,0.12),
                    transparent 55%
                ),
                #0a1624;

            box-shadow:
                0 30px 100px rgba(0,0,0,0.25);
        }

        .hero-project-image {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            opacity: 0.85;
        }

        /*
            GERÇEK VEKTOR GÖRSELİNİ BURAYA KOY:

            <img src="images/vektor-hero.jpg"
                 class="hero-project-image"
                 alt="Vektor gameplay">
        */

        .hero-project-placeholder {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(55,168,255,0.14),
                    transparent 60%
                );

            color: rgba(255,255,255,0.12);

            font-size: clamp(55px, 7vw, 95px);
            font-weight: 900;

            letter-spacing: -5px;
        }

        .hero-project-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(7,16,29,0.95),
                    rgba(7,16,29,0.1) 65%
                );
        }

        .hero-project-info {
            position: absolute;

            left: 28px;
            right: 28px;
            bottom: 28px;
        }

        .hero-project-label {
            color: var(--blue);

            font-size: 11px;
            font-weight: 750;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero-project-title {
            margin-top: 6px;

            font-size: 35px;
            font-weight: 800;

            letter-spacing: -1px;
        }

        .hero-project-text {
            margin-top: 5px;

            color: #aebaca;

            font-size: 13px;
        }


        /* =========================================================
           PROJECTS
        ========================================================= */

        .featured-project {
            position: relative;

            display: block;

            border: 1px solid var(--line);

            border-radius: 18px;

            overflow: hidden;

            background: var(--card);

            transition:
                transform 0.3s ease,
                border-color 0.3s ease;
        }

        .featured-project:hover {
            transform: translateY(-5px);
            border-color: var(--line-blue);
        }

        .featured-image {
            position: relative;

            height: 570px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    rgba(55,168,255,0.14),
                    transparent 60%
                ),
                #0d1c2c;
        }

        .featured-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: transform 0.7s ease;
        }

        .featured-project:hover .featured-image img {
            transform: scale(1.025);
        }

        .featured-placeholder {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: rgba(255,255,255,0.12);

            font-size: clamp(60px, 9vw, 120px);
            font-weight: 900;
            letter-spacing: -7px;
        }

        .image-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    transparent 45%,
                    rgba(7,16,29,0.72)
                );
        }

        .featured-content {
            padding: 36px;
        }

        .project-kicker {
            color: var(--blue);

            font-size: 11px;
            font-weight: 750;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .project-title {
            margin-top: 8px;

            font-size: 42px;
            line-height: 1;

            letter-spacing: -2px;
        }

        .project-description {
            max-width: 800px;

            margin-top: 14px;

            color: var(--muted);

            font-size: 15px;
            line-height: 1.8;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            margin-top: 23px;
        }

        .tag {
            padding: 6px 10px;

            border: 1px solid #26394e;

            border-radius: 5px;

            color: #a6b3c3;

            font-size: 11px;
            font-weight: 600;
        }

        .project-link {
            display: inline-flex;

            margin-top: 25px;

            color: var(--blue);

            font-size: 13px;
            font-weight: 750;
        }

        .other-projects {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 20px;

            margin-top: 20px;
        }

        .project-card {
            display: block;

            overflow: hidden;

            border: 1px solid var(--line);

            border-radius: 15px;

            background: var(--card);

            transition:
                transform 0.3s ease,
                border-color 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--line-blue);
        }

        .project-card-image {
            position: relative;

            height: 300px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    rgba(55,168,255,0.09),
                    transparent 65%
                ),
                #0d1b2b;
        }

        .project-card-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: transform 0.6s ease;
        }

        .project-card:hover img {
            transform: scale(1.03);
        }

        .project-card-placeholder {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: rgba(255,255,255,0.1);

            font-size: 38px;
            font-weight: 850;
            text-align: center;

            padding: 25px;
        }

        .project-card-content {
            padding: 26px;
        }

        .project-card-content h3 {
            font-size: 23px;
            letter-spacing: -0.8px;
        }

        .project-card-content p {
            margin-top: 9px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.7;
        }


        /* =========================================================
           EXPERTISE
        ========================================================= */

        .expertise-grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 17px;
        }

        .expertise-card {
            min-height: 230px;

            padding: 28px;

            border: 1px solid var(--line);

            border-radius: 13px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.012),
                    transparent
                );

            transition:
                border-color 0.25s ease,
                background 0.25s ease,
                transform 0.25s ease;
        }

        .expertise-card:hover {
            transform: translateY(-4px);

            border-color: var(--line-blue);

            background: var(--blue-soft);
        }

        .expertise-number {
            color: var(--blue);

            font-size: 11px;
            font-weight: 750;
            letter-spacing: 1px;
        }

        .expertise-card h3 {
            margin-top: 30px;

            font-size: 20px;

            letter-spacing: -0.5px;
        }

        .expertise-card p {
            margin-top: 10px;

            color: var(--muted-2);

            font-size: 14px;
            line-height: 1.75;
        }


        /* =========================================================
           ARTICLES
        ========================================================= */

        .content-cards {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 18px;
        }

        .content-card {
            display: block;

            overflow: hidden;

            border: 1px solid var(--line);

            border-radius: 14px;

            background: var(--card);

            transition:
                transform 0.3s ease,
                border-color 0.3s ease;
        }

        .content-card:hover {
            transform: translateY(-5px);

            border-color: var(--line-blue);
        }

        .content-image {
            position: relative;

            height: 210px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    rgba(55,168,255,0.1),
                    transparent
                ),
                #0d1b2b;
        }

        .content-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: transform 0.6s ease;
        }

        .content-card:hover .content-image img {
            transform: scale(1.04);
        }

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;

            font-size: 28px;
